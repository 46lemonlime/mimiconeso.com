      <stop offset="0%" stop-color="#190A2E"/>
      <stop offset="50%" stop-color="#46156B"/>
      <stop offset="100%" stop-color="#0F0C16"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#neonCathGrad)"/>

  <!-- Cathedral Gothic Cyber Spire -->
  <polygon points="250,50 300,320 200,320" fill="none" stroke="#A46BFF" stroke-width="3"/>
  <polygon points="250,90 285,320 215,320" fill="none" stroke="#FF3DAE" stroke-width="2"/>
  <circle cx="250" cy="180" r="50" fill="none" stroke="#62E9FF" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="250" cy="180" r="25" fill="#FF3DAE" opacity="0.4"/>
  <line x1="250" y1="20" x2="250" y2="350" stroke="#B7FF67" stroke-width="1.5"/>

