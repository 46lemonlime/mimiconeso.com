  <line x1="120" y1="180" x2="120" y2="370" stroke="#A46BFF" stroke-width="4"/>
  <line x1="380" y1="180" x2="380" y2="370" stroke="#A46BFF" stroke-width="4"/>
  <line x1="70" y1="230" x2="70" y2="370" stroke="#FF3DAE" stroke-width="2"/>
  <line x1="430" y1="230" x2="430" y2="370" stroke="#FF3DAE" stroke-width="2"/>

