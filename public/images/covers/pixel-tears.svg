<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgPixel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B29"/>
      <stop offset="50%" stop-color="#14314A"/>
      <stop offset="100%" stop-color="#1B1722"/>
    </linearGradient>
    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none" stroke="#62E9FF" stroke-width="0.75" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bgPixel)"/>
  <rect width="500" height="500" fill="url(#pixelGrid)"/>

  <!-- Chiptune Pixel Tear drops -->
  <g fill="#62E9FF" opacity="0.9">
    <!-- Big pixel tear -->
    <rect x="235" y="140" width="30" height="30"/>
    <rect x="220" y="170" width="60" height="30"/>
    <rect x="205" y="200" width="90" height="40"/>
    <rect x="220" y="240" width="60" height="30"/>
    <rect x="235" y="270" width="30" height="20"/>
  </g>
  <g fill="#FF3DAE" opacity="0.8">
    <rect x="240" y="175" width="20" height="20"/>
    <rect x="225" y="195" width="50" height="20"/>
  </g>

  <!-- Tamagotchi egg frame outline -->
  <path d="M150,130 C150,80 350,80 350,130 C350,260 380,360 250,370 C120,360 150,260 150,130 Z" fill="none" stroke="#B7FF67" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Pixel font lettering -->
  <text x="250" y="90" font-family="monospace" font-size="28" font-weight="900" fill="#62E9FF" text-anchor="middle" letter-spacing="3">
    [ PIXEL TEARS ]
  </text>
  <text x="250" y="420" font-family="monospace" font-size="20" font-weight="bold" fill="#EDE9F2" text-anchor="middle" letter-spacing="2">
    M1M1 CONESO
  </text>
  <text x="250" y="445" font-family="monospace" font-size="12" fill="#B7FF67" text-anchor="middle">
    CHIPTUNE / GLITCHCORE EP (2006)
  </text>

  <!-- Corner badges -->
  <rect x="20" y="20" width="80" height="24" fill="#FF3DAE"/>
  <text x="60" y="36" font-family="monospace" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">EP-003</text>
  <rect x="4" y="4" width="492" height="492" fill="none" stroke="#62E9FF" stroke-width="3"/>
</svg>
