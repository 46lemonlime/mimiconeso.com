<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1722"/>
      <stop offset="50%" stop-color="#2D124D"/>
      <stop offset="100%" stop-color="#FF3DAE"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3DAE"/>
      <stop offset="70%" stop-color="#A46BFF"/>
      <stop offset="100%" stop-color="#62E9FF"/>
    </linearGradient>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000" opacity="0.3"/>
      <rect x="2" y="2" width="2" height="2" fill="#000" opacity="0.3"/>
    </pattern>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.4"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#dither)"/>

  <!-- Cyber Grid in Background -->
  <g stroke="#A46BFF" stroke-width="1" opacity="0.25">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>

  <!-- Cyber Halo / Aura -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="#62E9FF" stroke-width="2" stroke-dasharray="6,4" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="145" fill="none" stroke="#FF3DAE" stroke-width="1.5" stroke-dasharray="12,6"/>

  <!-- Character Silhouette & Style -->
  <!-- Shoulders / Jacket -->
  <path d="M70,390 C80,310 130,285 200,285 C270,285 320,310 330,390 Z" fill="#14111E" stroke="#FF3DAE" stroke-width="3"/>
  <!-- Cyber Jacket Collar Details -->
  <path d="M140,285 L180,350 L200,320 L220,350 L260,285" fill="none" stroke="#62E9FF" stroke-width="2.5"/>
  <rect x="188" y="320" width="24" height="70" fill="#251E33" stroke="#A46BFF" stroke-width="1"/>
  <!-- Choker -->
  <rect x="175" y="250" width="50" height="16" rx="2" fill="#FF3DAE" stroke="#EDE9F2" stroke-width="1"/>
  <circle cx="200" cy="258" r="5" fill="#62E9FF"/>

  <!-- Neck -->
  <path d="M175,210 L175,255 L225,255 L225,210 Z" fill="#F4DEE7"/>

  <!-- Head / Face -->
  <path d="M145,150 C145,225 170,250 200,250 C230,250 255,225 255,150 C255,100 230,85 200,85 C170,85 145,100 145,150 Z" fill="#FFEBF2"/>

  <!-- Hair (Y2K scene/cybercore twin tails & bangs) -->
  <path d="M130,130 C110,60 160,40 200,40 C240,40 290,60 270,130 C290,180 320,240 330,340 C310,330 290,260 280,210 C270,180 260,160 255,140 C230,120 170,120 145,140 C140,160 130,180 120,210 C110,260 90,330 70,340 C80,240 110,180 130,130 Z" fill="url(#hairGrad)"/>

  <!-- Bangs -->
  <path d="M145,110 Q200,160 220,110 Q235,150 255,110 Q200,75 145,110 Z" fill="#FF3DAE"/>

  <!-- Eyes (Anime / Cyber style) -->
  <ellipse cx="178" cy="165" rx="14" ry="16" fill="#14111E"/>
  <ellipse cx="222" cy="165" rx="14" ry="16" fill="#14111E"/>
  <ellipse cx="178" cy="165" rx="10" ry="12" fill="#62E9FF"/>
  <ellipse cx="222" cy="165" rx="10" ry="12" fill="#62E9FF"/>
  <circle cx="175" cy="160" r="5" fill="#FFFFFF"/>
  <circle cx="219" cy="160" r="5" fill="#FFFFFF"/>
  <circle cx="182" cy="170" r="2" fill="#B7FF67"/>
  <circle cx="226" cy="170" r="2" fill="#B7FF67"/>

  <!-- Cheeks blush -->
  <ellipse cx="165" cy="180" rx="10" ry="4" fill="#FF3DAE" opacity="0.6"/>
  <ellipse cx="235" cy="180" rx="10" ry="4" fill="#FF3DAE" opacity="0.6"/>

  <!-- Cyber Bandage on cheek -->
  <rect x="220" y="185" width="22" height="8" rx="2" fill="#FFFFFF" transform="rotate(-15 220 185)"/>
  <line x1="229" y1="183" x2="231" y2="193" stroke="#FF3DAE" stroke-width="2"/>

  <!-- Smile / Piercing -->
  <path d="M192,205 Q200,212 208,205" stroke="#FF3DAE" stroke-width="2" fill="none"/>
  <circle cx="204" cy="217" r="2" fill="#EDE9F2"/>

  <!-- Cyber Over-ear Headphones -->
  <path d="M110,140 Q200,45 290,140" fill="none" stroke="#EDE9F2" stroke-width="7" stroke-linecap="round"/>
  <rect x="100" y="130" width="22" height="46" rx="10" fill="#FF3DAE" stroke="#62E9FF" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="278" y="130" width="22" height="46" rx="10" fill="#FF3DAE" stroke="#62E9FF" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Headphone cord -->
  <path d="M111,176 Q90,260 150,340" fill="none" stroke="#62E9FF" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Y2K Sparkles / Pixel Stars -->
  <g fill="#B7FF67">
    <!-- Star 1 -->
    <path d="M60,90 L65,75 L70,90 L85,95 L70,100 L65,115 L60,100 L45,95 Z"/>
    <!-- Star 2 -->
    <path d="M330,70 L334,58 L338,70 L350,74 L338,78 L334,90 L330,78 L318,74 Z" fill="#FF3DAE"/>
    <!-- Star 3 -->
    <path d="M320,280 L323,270 L326,280 L336,283 L326,286 L323,296 L320,286 L310,283 Z" fill="#62E9FF"/>
  </g>

  <!-- Digital Camera Watermark timestamp (2007 vintage!) -->
  <rect x="16" y="360" width="160" height="24" fill="#000000" opacity="0.75" rx="3"/>
  <text x="24" y="377" font-family="monospace" font-size="13" font-weight="bold" fill="#FF9900" letter-spacing="1">
    '07 05 14 23:42
  </text>

  <!-- Glitch bars -->
  <rect x="0" y="112" width="400" height="3" fill="#62E9FF" opacity="0.35"/>
  <rect x="0" y="278" width="400" height="2" fill="#FF3DAE" opacity="0.4"/>

  <!-- Scanlines overlay -->
  <rect width="400" height="400" fill="url(#scanlines)" pointer-events="none"/>
  
  <!-- Outer Cyber Border -->
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="#FF3DAE" stroke-width="4"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#62E9FF" stroke-width="1.5" stroke-dasharray="8,4"/>
</svg>
