<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Mimi live concert in vault -->
  <rect width="500" height="500" fill="#0A0812"/>
  <!-- Stage strobes and lasers -->
  <polygon points="0,0 200,500 150,500" fill="#FF3DAE" opacity="0.3"/>
  <polygon points="500,0 300,500 350,500" fill="#62E9FF" opacity="0.3"/>
  <polygon points="250,0 220,500 280,500" fill="#B7FF67" opacity="0.25"/>

  <!-- Crowd hands up silhouettes -->
  <g fill="#14111E">
    <circle cx="80" cy="460" r="16"/>
    <circle cx="140" cy="450" r="18"/>
    <circle cx="210" cy="465" r="15"/>
    <circle cx="290" cy="455" r="17"/>
    <circle cx="370" cy="460" r="16"/>
    <circle cx="440" cy="450" r="18"/>
    <!-- Raised hands -->
    <path d="M70,480 L65,410 L75,410 L80,480 Z"/>
    <path d="M145,470 L155,390 L165,390 L155,470 Z"/>
    <path d="M350,470 L340,400 L350,400 L360,470 Z"/>
  </g>

  <!-- Mimi on stage behind laptop & synth -->
  <rect x="180" y="320" width="140" height="15" fill="#2E243D"/>
  <rect x="220" y="295" width="45" height="25" rx="3" fill="#62E9FF" opacity="0.9"/>
  <!-- Glowing laptop apple/heart logo -->
  <circle cx="242" cy="307" r="4" fill="#FFFFFF"/>
  <circle cx="250" cy="250" r="24" fill="#EDE9F2"/>
  <!-- Pink hair waving -->
  <path d="M225,240 C210,210 270,200 275,240 C290,265 290,290 285,310 L215,310 Z" fill="#FF3DAE"/>

  <text x="30" y="475" font-family="monospace" font-size="14" font-weight="900" fill="#FF9900">
    '07 02 14 [BERLIN VAULT 99]
  </text>
</svg>
