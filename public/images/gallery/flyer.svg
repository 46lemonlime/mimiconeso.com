<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <!-- Underground Rave Flyer (Akihabara / Shibuya 2006) -->
  <rect width="400" height="560" fill="#0E071A"/>
  <rect x="12" y="12" width="376" height="536" fill="none" stroke="#FF3DAE" stroke-width="4"/>
  <rect x="20" y="20" width="360" height="520" fill="none" stroke="#62E9FF" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="200" y="70" font-family="monospace" font-size="20" font-weight="900" fill="#B7FF67" text-anchor="middle" letter-spacing="3">
    ★ SECRET RAVE #03 ★
  </text>
  <text x="200" y="105" font-family="Impact, sans-serif" font-size="44" font-weight="900" fill="#FF3DAE" text-anchor="middle" letter-spacing="2">
