      <stop offset="0%" stop-color="#FF3DAE"/>
      <stop offset="25%" stop-color="#62E9FF"/>
      <stop offset="50%" stop-color="#B7FF67"/>
      <stop offset="75%" stop-color="#A46BFF"/>
      <stop offset="100%" stop-color="#FF3DAE"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#14111E"/>
  <!-- Holographic Die-cut sticker -->
  <g transform="translate(40, 40) rotate(-4 210 210)">
