<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" fill="#0D0C12"/>
  <!-- Vintage beige CRT Monitor -->
  <rect x="25" y="25" width="110" height="95" rx="8" fill="#CBC5B6" stroke="#9E9889" stroke-width="3"/>
  <!-- Curved Screen -->
  <rect x="36" y="34" width="88" height="74" rx="14" fill="#0E1E24" stroke="#485A5F" stroke-width="2"/>
  <!-- Static noise lines on screen -->
  <line x1="38" y1="45" x2="122" y2="45" stroke="#62E9FF" stroke-width="1" opacity="0.6"/>
  <line x1="38" y1="58" x2="122" y2="58" stroke="#FF3DAE" stroke-width="1.5" opacity="0.8"/>
  <line x1="38" y1="72" x2="122" y2="72" stroke="#B7FF67" stroke-width="1" opacity="0.7"/>
  <line x1="38" y1="88" x2="122" y2="88" stroke="#62E9FF" stroke-width="1" opacity="0.5"/>
  <!-- Power LED -->
  <circle cx="120" cy="112" r="3" fill="#B7FF67"/>
  <!-- Monitor Stand -->
  <polygon points="65,120 95,120 105,145 55,145" fill="#B8B2A3"/>
  <rect x="1" y="1" width="158" height="158" fill="none" stroke="#62E9FF" stroke-width="2"/>
</svg>
